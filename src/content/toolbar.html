<div id="weblens-toolbar">
    <div class="weblens-brand">
        <span class="weblens-brand-web">Web</span><span class="weblens-brand-lens">Lens</span>
    </div>

    <div class="weblens-divider"></div>

    <div class="weblens-nav-buttons">
        <button class="weblens-nav-btn active" data-tab="font">
            <span>Font / Size</span>
        </button>

        <button class="weblens-nav-btn" data-tab="colors">
            <span>Colors</span>
        </button>

        <button class="weblens-nav-btn" data-tab="tech_stack">
            <span>tech stack</span>
        </button>
    </div>

    <div class="weblens-divider"></div>

    <button class="weblens-close-btn" id="weblens-stop-inspection-btn" title="Stop Inspection">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Stop</span>

</div>
