<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebLens</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body class="w-[250px] p-[15px] font-[Arial,sans-serif]">

    <h1 class="mt-0 text-2xl font-bold">WebLens</h1>

    <p class="my-3">Frontend Website Analysis</p>
    <p class="my-3">Analyze the font of the web you like</p>

    <button id="startBtn"
        class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-lg shadow-md shadow-blue-500/30 hover:shadow-lg hover:shadow-blue-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1">Start
        Inspection</button>
    <button id="stopBtn" style="background-color: #dc2626 !important; color: #ffffff !important; margin-top: 10px;"
        class="w-full py-2.5 px-4 text-white font-semibold rounded-lg shadow-md shadow-red-500/30 hover:bg-red-700 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer text-sm outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-1">Stop
        Inspection</button>

    <p id="status" class="mt-3">Extension is ready.</p>

    <script src="popup.js"></script>

</body>

</html>
